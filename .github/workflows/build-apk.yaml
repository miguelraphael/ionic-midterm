name: Build Daily Task APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ionic Vue application
        run: pnpm run build

      - name: Set up Java 21 (For Capacitor Plugins)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check Java Version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DailyTaskApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyTask-APK
          path: DailyTaskApp.apk
          if-no-files-found: error
          retention-days: 30
